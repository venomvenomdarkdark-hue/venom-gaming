}
function draw(){
 if(!skyG){skyG=ctx.createLinearGradient(0,0,0,H);skyG.addColorStop(0,'#14233d');skyG.addColorStop(.55,'#2a3c55');skyG.addColorStop(1,'#3a4a58')}
 ctx.fillStyle=skyG;ctx.fillRect(0,0,W,H);
 for(const st of STARS){ctx.fillStyle='rgba(255,255,255,'+st.a+')';ctx.fillRect(st.x*W,st.y*H*.4,st.r,st.r)}
 ctx.fillStyle='#e6edf7';ctx.beginPath();ctx.arc(W*.78,H*.2,Math.min(W,H)*.045,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2b3b33';ctx.fillRect(0,H*.42,W,H*.58);
 for(let z=-20;z<200;z+=4){const a=P(-6,0,z),b=P(6,0,z),c=P(6,0,z+4),d=P(-6,0,z+4);if(a&&b&&c&&d)poly([a,b,c,d],'#262b30');const m1=P(0,0,z),m2=P(0,0,z+4);if(m1&&m2&&Math.round((z+20)/4)%2===0){ctx.strokeStyle='#eee2b6';ctx.lineWidth=Math.max(1,m1.s*.035);ctx.beginPath();ctx.moveTo(m1.x,m1.y);ctx.lineTo(m2.x,m2.y);ctx.stroke()}}
 const cX=S.px-Math.sin(S.yaw)*10,cZ=S.pz-Math.cos(S.yaw)*10,L=[];
 for(const b of blds){const d=(b.x-cX)**2+(b.z-cZ)**2;if(d<180*180)L.push({d,f:()=>bld(b,cX,cZ,d)})}
 for(const t of trees){const d=(t.x-cX)**2+(t.z-cZ)**2;if(d<180*180)L.push({d,f:()=>tree(t)})}
 const M=MIS[S.mi];if(M)M.pts.forEach(p=>{if(!p.got){const d=(p.x-cX)**2+(p.z-cZ)**2;L.push({d,f:()=>item(p,M.k)})}});
 for(const z of ZOM){if(z.on){const d=(z.x-cX)**2+(z.z-cZ)**2;if(d<180*180)L.push({d,f:()=>zombie(z)})}}
 for(const m of MON){if(m.on){const d=(m.x-cX)**2+(m.z-cZ)**2;if(d<180*180)L.push({d,f:()=>monster(m)})}}
 L.push({d:(4-cX)**2+(9-cZ)**2,f:car});L.sort((a,b)=>b.d-a.d);for(const o of L)o.f();
 ctx.fillStyle='rgba(2,5,14,.20)';ctx.fillRect(0,0,W,H);if(M)guide(M);player();minimap();
 const bw=160,bx=W/2-bw/2,by=44;ctx.fillStyle='#07111dcc';ctx.fillRect(bx-2,by-2,bw+4,12);ctx.fillStyle=S.hp>35?'#55d672':'#ff4d4d';ctx.fillRect(bx,by,bw*clamp(S.hp,0,100)/100,8);
 if(S.hurt>0){const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.7);g.addColorStop(0,'rgba(200,0,0,0)');g.addColorStop(1,'rgba(200,0,0,'+Math.min(.6,S.hurt*2)+')');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
 if(S.dead){ctx.fillStyle='#050812cc';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 28px Arial';ctx.fillText('انتهت اللعبة',W/2,H/2);ctx.font='16px Arial';ctx.fillText('اضغط «العب من جديد» لإعادة المحاولة',W/2,H/2+32);ctx.textAlign='left'}
}
function blocked(x,z){
 const rad=1.25;
 for(const b of blds){if(Math.abs(x-b.x)<b.w/2+rad&&Math.abs(z-b.z)<b.d/2+rad)return true}
 for(const t of trees){if(Math.hypot(x-t.x,z-t.z)<1.6)return true}
 return false;
}
function distance(a,b){return Math.hypot(a.x-b.x,a.z-b.z)}
function update(dt){
 if(S.dead)return;
 S.tm+=dt;S.hurt=Math.max(0,S.hurt-dt);S.run=sprintOn;
 let ix=inp.x,iy=inp.y;
 if(keys.a||keys.ArrowLeft)ix-=1;if(keys.d||keys.ArrowRight)ix+=1;if(keys.w||keys.ArrowUp)iy-=1;if(keys.s||keys.ArrowDown)iy+=1;
 const mag=Math.hypot(ix,iy);if(mag>1){ix/=mag;iy/=mag}
 S.moving=Math.abs(ix)+Math.abs(iy)>.05;
 if(S.moving){
  const speed=(S.run?9:5)*dt;
  // forward is +z; joystick up means move forward
  const dx=(ix*Math.cos(S.yaw)-iy*Math.sin(S.yaw))*speed;
  const dz=(-ix*Math.sin(S.yaw)-iy*Math.cos(S.yaw))*speed;
  if(!blocked(S.px+dx,S.pz))S.px+=dx;
  if(!blocked(S.px,S.pz+dz))S.pz+=dz;
  S.step+=dt*(S.run?13:8);
 }
 if(S.air){S.vy-=18*dt;S.jy+=S.vy*dt;if(S.jy<=0){S.jy=0;S.vy=0;S.air=false}}
 const M=MIS[S.mi];
 if(M&&M.k==='exit'&&M.pts.every(p=>p.got)===false){
   // Exit can be activated only after reaching it.
 }
 for(const z of ZOM){
  if(!z.on&&S.tm>z.at){z.on=true;toast('فيه زومبي طالع من الأرض!')}
  if(!z.on)continue;
  z.t+=dt;z.rise=Math.min(1,z.rise+dt*.45);z.ph+=dt*5;
  const dx=S.px-z.x,dz=S.pz-z.z,dist=Math.hypot(dx,dz);
  if(dist<23&&dist>1.5){const sp=1.25*dt,nx=z.x+dx/dist*sp,nz=z.z+dz/dist*sp;if(!blocked(nx,z.z))z.x=nx;if(!blocked(z.x,nz))z.z=nz}
  if(dist<2.1&&S.hurt<=0){S.hp-=8;S.hurt=.8;toast('الزومبي هاجمك!');if(S.hp<=0){S.hp=0;S.dead=true;$('again').style.display='block';saveGame(false)}}
 }
 for(const m of MON){if(!m.on&&S.tm>22)m.on=true;if(m.on){m.ph+=dt*3;const dist=Math.hypot(S.px-m.x,S.pz-m.z);if(dist<3&&S.hurt<=0){S.hp-=15;S.hurt=1;toast('الوحش قرب منك!');if(S.hp<=0){S.hp=0;S.dead=true;$('again').style.display='block';saveGame(false)}}}}
 hud();
}
function interact(){
 if(S.dead)return;
 const M=MIS[S.mi];if(!M){toast('أنت خلصت كل المهمات! 🐉');return}
 const p=M.pts.find(p=>!p.got);if(!p){S.mi++;if(S.mi>=MIS.length){hud();toast('مبروك! خلصت كل المهمات 🐉')}else toast('مهمة جديدة: '+MIS[S.mi].t);hud();saveGame(false);return}
 const d=Math.hypot(S.px-p.x,S.pz-p.z);
 if(d>4.2){toast('قرّب أكتر من العلامة الأول');return}
 p.got=true;toast(M.k==='bag'?'جمعت حقيبة إمدادات!':M.k==='beacon'?'نقطة الاتصال اتفعّلت!':'وصلت لنقطة الاستخراج!');
 if(M.pts.every(v=>v.got)){S.mi++;if(S.mi>=MIS.length)toast('مبروك! خلصت كل المهمات 🐉');else toast('مهمة جديدة: '+MIS[S.mi].t)}
 hud();saveGame(false);
}
function jump(){if(!S.air&&!S.dead){S.air=true;S.vy=7}}
function resetGame(){
 S.px=0;S.pz=0;S.yaw=0;S.jy=0;S.vy=0;S.air=false;S.mi=0;S.hp=100;S.hurt=0;S.dead=false;S.tm=0;S.step=0;
 MIS.forEach(m=>m.pts.forEach(p=>p.got=false));ZOM.forEach((z,i)=>{z.on=false;z.rise=0;z.t=0;z.x=ZSPAWN[i].x;z.z=ZSPAWN[i].z});MON.forEach(m=>{m.on=false;m.fall=0;m.ph=0});
 $('again').style.display='none';hud();saveGame(false);toast('بدأت لعبة جديدة');
}
$('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
$('sprint').addEventListener('pointerdown',e=>{e.preventDefault();sprintOn=true});
['pointerup','pointercancel','pointerleave'].forEach(ev=>$('sprint').addEventListener(ev,()=>sprintOn=false));
$('act').addEventListener('pointerdown',e=>{e.preventDefault();interact()});
$('again').addEventListener('click',resetGame);
$('help').addEventListener('click',()=>saveGame(true));
addEventListener('keydown',e=>{keys[e.key]=true;keys[e.key.toLowerCase()]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key===' '||e.key==='Spacebar')jump();if(e.key==='e'||e.key==='E')interact();if(e.key==='Shift')sprintOn=true});
addEventListener('keyup',e=>{keys[e.key]=false;keys[e.key.toLowerCase()]=false;if(e.key==='Shift')sprintOn=false});
const joy=$('joy'),knob=$('knob');
function joyMove(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=40,len=Math.hypot(dx,dy),scale=len>max?max/len:1;inp.x=dx*scale/max;inp.y=dy*scale/max;knob.style.left=(40+dx*scale)+'px';knob.style.top=(40+dy*scale)+'px'}
function joyEnd(){joyOn=false;inp.x=0;inp.y=0;knob.style.left='40px';knob.style.top='40px'}
joy.addEventListener('pointerdown',e=>{e.preventDefault();joyOn=true;joy.setPointerCapture(e.pointerId);joyMove(e)});
joy.addEventListener('pointermove',e=>{if(joyOn)joyMove(e)});
joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveGame(false)});
addEventListener('pagehide',()=>saveGame(false));
setInterval(()=>saveGame(false),10000);
loadGame();hud();
function loop(now){const dt=Math.min(.04,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
</script>
