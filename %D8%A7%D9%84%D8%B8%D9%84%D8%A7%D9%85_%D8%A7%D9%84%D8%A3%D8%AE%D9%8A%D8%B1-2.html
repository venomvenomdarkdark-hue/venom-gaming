<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>الظلام الأخير</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080a0e;color:#f2f2f2;font-family:Arial,sans-serif;text-align:center;overflow:hidden}
header{padding:10px 8px;background:#11151d;border-bottom:1px solid #29303b}h1{font-size:22px;margin:2px 0 5px;color:#e8e8e8}#info{font-size:14px;color:#c4c9d2}
#game{display:block;width:min(100vw,720px);height:min(65vh,520px);margin:8px auto;background:#050608;border:1px solid #353b45;touch-action:none}
#controls{width:min(100vw,420px);margin:8px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:0 12px}
button{background:#1b222d;color:#fff;border:1px solid #566171;border-radius:12px;padding:13px;font-size:18px;font-weight:bold;touch-action:manipulation}
button:active{background:#3b4657}#tip{font-size:12px;color:#9da6b4;padding:3px 12px}
#overlay{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;padding:20px}
.card{max-width:400px;background:#121721;border:1px solid #505a69;border-radius:16px;padding:22px;box-shadow:0 0 35px #000}
.card h2{margin-top:0}.card p{line-height:1.7;color:#d3d7df}.card button{background:#6b2028}
</style>
</head>
<body>
<header><h1>الظلام الأخير</h1><div id="info">المفاتيح: 0 / 5 — دور على المخرج!</div></header>
<canvas id="game" width="480" height="360" aria-label="لعبة متاهة رعب"></canvas>
<div id="controls">
<div></div><button data-move="up">⬆️</button><div></div>
<button data-move="left">⬅️</button><button data-move="down">⬇️</button><button data-move="right">➡️</button>
</div>
<div id="tip">استخدم الأسهم أو أزرار الموبايل. اجمع 5 مفاتيح ووصل للباب الأحمر.</div>
<div id="overlay"><div class="card"><h2 id="welcome">الظلام الأخير</h2><p id="message">أنت محبوس في متاهة مظلمة. اجمع المفاتيح الخمسة وافلت قبل ما الوحش يمسكك!</p><button id="start">ابدأ اللعب</button></div></div>
<script>
(() => {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const info=document.getElementById('info'),overlay=document.getElementById('overlay'),startBtn=document.getElementById('start'),welcome=document.getElementById('welcome'),message=document.getElementById('message');
const map=[
"############",
"#P...#....K#",
"#.##.#.##..#",
"#....#.....#",
"###.####.#.#",
"#K..#....#.#",
"#.#...##...#",
"#.###.##.#.#",
"#...K....#.#",
"#.##.###...#",
"#K....K...E#",
"############"
];
let grid=[],player={x:1,y:1},monster={x:10,y:1},keys=0,gameOn=false,won=false,lost=false,lastMonster=0;
function reset(){grid=map.map(r=>r.split(''));player={x:1,y:1};monster={x:10,y:1};keys=0;gameOn=true;won=false;lost=false;lastMonster=0;grid[1][1]='.';info.textContent='المفاتيح: 0 / 5 — دور على المخرج!';overlay.style.display='none';draw();}
function wall(x,y){return !grid[y]||grid[y][x]==='#'}
function move(dx,dy){if(!gameOn)return;let nx=player.x+dx,ny=player.y+dy;if(wall(nx,ny))return;player.x=nx;player.y=ny;
if(grid[ny][nx]==='K'){keys++;grid[ny][nx]='.';info.textContent=`المفاتيح: ${keys} / 5 — ${keys===5?'الباب اتفتح!':'كمّل دور على المفاتيح'}`;}
if(grid[ny][nx]==='E'){if(keys>=5){finish(true,'هربت من المتاهة!','مبروك يا بطل! جمعت المفاتيح وخرجت سالم.');return}else{info.textContent=`لسه ناقصك ${5-keys} مفتاح عشان تفتح الباب!`;}}
if(nx===monster.x&&ny===monster.y){finish(false,'الوحش لحقك!','حاول تاني وخليك بتتحرك بحذر.');return}draw();}
function finish(win,title,msg){gameOn=false;won=win;lost=!win;welcome.textContent=title;message.textContent=msg;startBtn.textContent='العب من جديد';overlay.style.display='flex';}
function draw(){
const w=canvas.width,h=canvas.height,cell=30;ctx.fillStyle='#07090d';ctx.fillRect(0,0,w,h);
for(let y=0;y<grid.length;y++)for(let x=0;x<grid[y].length;x++){
let d=Math.abs(x-player.x)+Math.abs(y-player.y),lit=d<5;
ctx.fillStyle=grid[y][x]==='#'?(lit?'#333a46':'#11151c'):(lit?'#171d25':'#090c11');ctx.fillRect(x*cell,y*cell,cell-1,cell-1);
if(grid[y][x]==='K'){ctx.fillStyle='#ffd54a';ctx.font='19px Arial';ctx.fillText('🔑',x*cell+4,y*cell+22)}
if(grid[y][x]==='E'){ctx.fillStyle=keys>=5?'#e64b55':'#69262d';ctx.fillRect(x*cell+6,y*cell+4,18,24);ctx.fillStyle='#fff';ctx.fillRect(x*cell+19,y*cell+15,3,3)}
}
ctx.fillStyle='#e9edf5';ctx.beginPath();ctx.arc(player.x*cell+15,player.y*cell+15,9,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#db3544';ctx.beginPath();ctx.arc(monster.x*cell+15,monster.y*cell+15,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(monster.x*cell+10,monster.y*cell+12,3,3);ctx.fillRect(monster.x*cell+17,monster.y*cell+12,3,3);
}
function monsterStep(){if(!gameOn)return;let opts=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>({x:monster.x+dx,y:monster.y+dy})).filter(p=>!wall(p.x,p.y));opts.sort((a,b)=>(Math.abs(a.x-player.x)+Math.abs(a.y-player.y))-(Math.abs(b.x-player.x)+Math.abs(b.y-player.y)));if(opts.length){monster=opts[0];if(monster.x===player.x&&monster.y===player.y){finish(false,'الوحش لحقك!','حاول تاني وخليك بتتحرك بحذر.');return}}draw();}
document.addEventListener('keydown',e=>{const m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];if(m){e.preventDefault();move(...m)}});
document.querySelectorAll('[data-move]').forEach(b=>{const m={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[b.dataset.move];b.addEventListener('click',()=>move(...m));});
startBtn.addEventListener('click',reset);
setInterval(()=>{if(gameOn&&Date.now()-lastMonster>850){lastMonster=Date.now();monsterStep()}},250);
draw();
})();
</script>
</body>
</html>
