<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>الظلام الأخير</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#eee;font-family:system-ui,tahoma;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%}#hud{position:fixed;top:10px;right:12px;left:12px;display:flex;justify-content:space-between;text-shadow:0 2px 5px #000;pointer-events:none}#overlay{position:fixed;inset:0;background:#000e;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px}h1{color:#d11;font-size:36px;margin:0}p{line-height:1.8;color:#ccc;max-width:420px}button{border:0;border-radius:12px;background:#a10f18;color:white;padding:13px 32px;font-size:18px;font-weight:bold}</style></head><body><canvas id="c"></canvas><div id="hud"><span id="k">🔑 0/5</span><span id="m">اجمع المفاتيح وابحث عن الباب</span></div><div id="overlay"><h1 id="title">الظلام الأخير</h1><p id="desc">أنت داخل قبو مظلم، وشيء ما يطاردك. اجمع 5 مفاتيح ثم اهرب من الباب.<br><br>الكمبيوتر: W/S للحركة، A/D للحركة الجانبية، الأسهم للالتفات.<br>الجوال: اسحب بإصبع يسار الشاشة للحركة وبإصبع يمينها للالتفات.<br><br>اضغط ابدأ لتفعيل الصوت.</p><button id="start">ابدأ اللعب</button></div><script>
(()=>{'use strict';const c=document.querySelector('#c'),x=c.getContext('2d'),$=id=>document.getElementById(id);let w,h;function resize(){w=c.width=innerWidth;h=c.height=innerHeight}addEventListener('resize',resize);resize();const MW=21,MH=15,NEED=5;let map=[],p,g,keys=[],got=0,state='menu',startT=0,last=0,phase=0,joy={x:0,y:0},mt=null,lt=null,held={},audio;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function beep(f=180,d=.12,type='sine',vol=.08,end=f){try{audio=audio||new(window.AudioContext||webkitAudioContext)();audio.resume();let o=audio.createOscillator(),a=audio.createGain(),n=audio.currentTime;o.type=type;o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(Math.max(1,end),n+d);a.gain.setValueAtTime(vol,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(audio.destination);o.start();o.stop(n+d)}catch(e){}}function maze(){map=Array.from({length:MH},()=>Array(MW).fill(1));let stack=[[1,1]];map[1][1]=0;while(stack.length){let [cx,cy]=stack[stack.length-1],dirs=[[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-.5),moved=false;for(let[dx,dy]of dirs){let nx=cx+dx,ny=cy+dy;if(nx>0&&ny>0&&nx<MW-1&&ny<MH-1&&map[ny][nx]===1){map[cy+dy/2][cx+dx/2]=0;map[ny][nx]=0;stack.push([nx,ny]);moved=true;break}}if(!moved)stack.pop()}map[MH-2][MW-2]=0;map[MH-2][MW-3]=0;map[MH-3][MW-2]=0;map[MH-2][MW-2]=2}function open(x,y){let a=Math.floor(x),b=Math.floor(y);return b>=0&&b<MH&&a>=0&&a<MW&&map[b][a]!==1}function free(x,y){return open(x-.18,y-.18)&&open(x+.18,y-.18)&&open(x-.18,y+.18)&&open(x+.18,y+.18)}function hud(){ $('k').textContent='🔑 '+got+'/'+NEED;$('m').textContent=got<NEED?'ابحث عن المفاتيح':'اهرب إلى الباب!'}function begin(){maze();p={x:1.5,y:1.5,a:Math.PI/2};g={x:MW-2.5,y:MH-2.5};got=0;let spots=[];for(let y=1;y<MH-1;y++)for(let xx=1;xx<MW-1;xx++)if(map[y][xx]===0&&xx+y>10&&Math.hypot(xx-.5,y-.5)>5&&Math.hypot(xx+.5-g.x,y+.5-g.y)>3)spots.push({x:xx+.5,y:y+.5});spots.sort(()=>Math.random()-.5);keys=spots.slice(0,NEED).map(o=>({...o,on:true}));state='play';startT=performance.now();phase=0;$('overlay').style.display='none';hud();beep(500,.15,'triangle',.08,800)}function over(win){state=win?'win':'dead';$('title').textContent=win?'نجوت! 🎉':'أمسك بك!';$('desc').innerHTML=win?'هربت من القبو بنجاح.':'جمعت '+got+' من '+NEED+' مفاتيح. حاول مرة أخرى.';$('start').textContent='العب مرة أخرى';$('overlay').style.display='flex';beep(win?440:700,.5,win?'triangle':'sawtooth',.12,win?880:60)}function pathStep(){let sx=Math.floor(g.x),sy=Math.floor(g.y),tx=Math.floor(p.x),ty=Math.floor(p.y),dist=Array.from({length:MH},()=>Array(MW).fill(-1)),first=Array.from({length:MH},()=>Array(MW).fill(null)),q=[[tx,ty]];if(!open(tx+.5,ty+.5))return null;dist[ty][tx]=0;for(let i=0;i<q.length;i++){let [a,b]=q[i];for(let[dx,dy]of [[1,0],[-1,0],[0,1],[0,-1]]){let nx=a+dx,ny=b+dy;if(ny>=0&&ny<MH&&nx>=0&&nx<MW&&map[ny][nx]!==1&&dist[ny][nx]<0){dist[ny][nx]=dist[b][a]+1;first[ny][nx]=[a,b];q.push([nx,ny])}}}if(dist[sy]?.[sx]<0)return null;let cur=[sx,sy];while(first[cur[1]][cur[0]]&&dist[cur[1]][cur[0]]>1)cur=first[cur[1]][cur[0]];return dist[sy][sx]===0?[p.x,p.y]:[cur[0]+.5,cur[1]+.5]}function update(dt){p.a+=((held.arrowright?1:0)-(held.arrowleft?1:0))*2.2*dt;let f=(held.w||held.arrowup?1:0)-(held.s||held.arrowdown?1:0)-joy.y,s=(held.d?1:0)-(held.a?1:0)+joy.x,vx=Math.cos(p.a)*f-Math.sin(p.a)*s,vy=Math.sin(p.a)*f+Math.cos(p.a)*s,L=Math.hypot(vx,vy);if(L>1){vx/=L;vy/=L}let speed=2.4*dt;if(free(p.x+vx*speed,p.y))p.x+=vx*speed;if(free(p.x,p.y+vy*speed))p.y+=vy*speed;if(L>.1)phase+=dt*9;for(let k of keys)if(k.on&&Math.hypot(k.x-p.x,k.y-p.y)<.5){k.on=false;got++;beep(650,.15,'triangle',.12,950);hud()}if(Math.hypot(MW-1.5-p.x,MH-1.5-p.y)<.75){if(got===NEED){over(true);return}else $('m').textContent='الباب مقفل — اجمع كل المفاتيح'}if(performance.now()-startT>6500){let target=pathStep();if(target){let dx=target[0]-g.x,dy=target[1]-g.y,d=Math.hypot(dx,dy)||1,step=Math.min((.72+got*.12)*dt,d);g.x+=dx/d*step;g.y+=dy/d*step}}if(Math.hypot(g.x-p.x,g.y-p.y)<.55)over(false)}function draw(){let horizon=h/2+Math.sin(phase)*2,bg=x.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#020202');bg.addColorStop(.55,'#050403');bg.addColorStop(1,'#1b120b');x.fillStyle=bg;x.fillRect(0,0,w,h);let rays=Math.min(420,Math.ceil(w/3)),strip=w/rays,depth=[];let dx=Math.cos(p.a),dy=Math.sin(p.a),px=-dy*.67,py=dx*.67;for(let i=0;i<rays;i++){let cam=2*i/rays-1,rx=dx+px*cam,ry=dy+py*cam,mx=Math.floor(p.x),my=Math.floor(p.y),ddx=Math.abs(1/(rx||.0001)),ddy=Math.abs(1/(ry||.0001)),sx=rx<0?-1:1,sy=ry<0?-1:1,sdx=(rx<0?p.x-mx:mx+1-p.x)*ddx,sdy=(ry<0?p.y-my:my+1-p.y)*ddy,side=0,guard=0;while(guard++<60&&map[my]&&map[my][mx]===0){if(sdx<sdy){sdx+=ddx;mx+=sx;side=0}else{sdy+=ddy;my+=sy;side=1}}let d=Math.max(.05,side?sdy-ddy:sdx-ddx);depth[i]=d;let wh=Math.min(h*2,h/d),top=horizon-wh/2,door=map[my]&&map[my][mx]===2,shade=clamp(1-d/7,.12,.85)*(side?.72:1);x.fillStyle=door?(got===NEED?'#164326':'#461211'):`rgb(${45*shade|0},${38*shade|0},${31*shade|0})`;x.fillRect(i*strip,top,strip+1,wh);x.fillStyle='rgba(0,0,0,'+clamp(d/9,.1,.88)+')';x.fillRect(i*strip,top,strip+1,wh);if(door){x.fillStyle=got===NEED?'rgba(0,255,70,.15)':'rgba(255,0,0,.12)';x.fillRect(i*strip,top,strip+1,wh)}}let sprites=keys.filter(k=>k.on).map(k=>({...k,type:'key',size:.28}));sprites.push({...g,type:'monster',size:1});sprites.sort((a,b)=>Math.hypot(b.x-p.x,b.y-p.y)-Math.hypot(a.x-p.x,a.y-p.y));for(let s of sprites){let ax=s.x-p.x,ay=s.y-p.y,forward=ax*dx+ay*dy,side=ax*(-dy)+ay*dx;if(forward<=.1)continue;let sx=w/2+side/forward*w*.67,size=Math.min(h*1.2,h/forward*s.size),top=horizon-size/2,col=Math.floor(sx/strip);if(col>=0&&col<rays&&forward>depth[col]+.1)continue;if(s.type==='key'){let gr=x.createRadialGradient(sx,top+size/2,1,sx,top+size/2,size);gr.addColorStop(0,'#ffdf55');gr.addColorStop(1,'rgba(255,170,0,0)');x.fillStyle=gr;x.fillRect(sx-size,top-size,size*2,size*2);x.strokeStyle='#fff0a0';x.lineWidth=Math.max(2,size*.08);x.beginPath();x.arc(sx,top+size*.35,size*.16,0,Math.PI*2);x.moveTo(sx,top+size*.5);x.lineTo(sx,top+size*.9);x.stroke()}else{x.globalAlpha=clamp(1-forward/9,.1,.95);x.fillStyle='#30382f';x.beginPath();x.ellipse(sx,top+size*.62,size*.32,size*.42,0,0,Math.PI*2);x.fill();x.fillStyle='#8b9284';x.beginPath();x.ellipse(sx,top+size*.26,size*.23,size*.25,0,0,Math.PI*2);x.fill();x.fillStyle='#f22';x.shadowColor='red';x.shadowBlur=size*.15;x.beginPath();x.arc(sx-size*.09,top+size*.23,size*.035,0,7);x.arc(sx+size*.09,top+size*.23,size*.035,0,7);x.fill();x.shadowBlur=0;x.globalAlpha=1}}let vignette=x.createRadialGradient(w/2,horizon,Math.min(w,h)*.08,w/2,horizon,Math.max(w,h)*.72);vignette.addColorStop(0,'rgba(0,0,0,0)');vignette.addColorStop(.5,'rgba(0,0,0,.48)');vignette.addColorStop(1,'rgba(0,0,0,.96)');x.fillStyle=vignette;x.fillRect(0,0,w,h);if('ontouchstart'in window&&state==='play'){x.strokeStyle='#ffffff55';x.fillStyle='#ffffff13';x.lineWidth=2;x.beginPath();x.arc(82,h-112,48,0,7);x.fill();x.stroke();x.fillStyle='#ffffff66';x.beginPath();x.arc(82+joy.x*30,h-112+joy.y*30,20,0,7);x.fill();x.strokeStyle='#ffffff44';x.beginPath();x.arc(w-72,h-112,38,0,7);x.stroke()}}function frame(ts){let dt=Math.min(.04,(ts-last)/1000||0);last=ts;if(state==='play')update(dt);if(state!=='menu')draw();requestAnimationFrame(frame)}$('start').onclick=begin;addEventListener('keydown',e=>{held[e.key.toLowerCase()]=true;if(e.key.startsWith('Arrow'))e.preventDefault()},{passive:false});addEventListener('keyup',e=>held[e.key.toLowerCase()]=false);c.addEventListener('touchstart',e=>{e.preventDefault();for(let t of e.changedTouches){if(t.clientX<w/2&&!mt)mt={id:t.identifier,x:t.clientX,y:t.clientY};else if(!lt)lt={id:t.identifier,x:t.clientX,y:t.clientY}}},{passive:false});c.addEventListener('touchmove',e=>{e.preventDefault();for(let t of e.changedTouches){if(mt&&t.identifier===mt.id){joy.x=clamp((t.clientX-mt.x)/45,-1,1);joy.y=clamp((t.clientY-mt.y)/45,-1,1)}else if(lt&&t.identifier===lt.id){p.a+=(t.clientX-lt.x)*.006;lt.x=t.clientX}}},{passive:false});function end(e){for(let t of e.changedTouches){if(mt&&t.identifier===mt.id){mt=null;joy={x:0,y:0}}if(lt&&t.identifier===lt.id)lt=null}}c.addEventListener('touchend',end);c.addEventListener('touchcancel',end);addEventListener('mousemove',e=>{if(document.pointerLockElement&&state==='play')p.a+=e.movementX*.0025});c.addEventListener('click',()=>{if(state==='play'&&c.requestPointerLock)c.requestPointerLock()});requestAnimationFrame(frame)})();
</script></body></html>
